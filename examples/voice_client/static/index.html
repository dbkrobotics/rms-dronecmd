<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Voice Interface</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #1a1a1a; color: #eee; margin: 0; }
        h1 { margin-bottom: 20px; }
        #status { font-size: 1.2em; margin-bottom: 20px; color: #aaa; }
        .mic-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background-color: #dc3545; border: none; outline: none; cursor: pointer;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4); transition: transform 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        .mic-btn.listening { background-color: #28a745; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4); animation: pulse 1.5s infinite; }
        .mic-btn:active { transform: scale(0.95); }
        .mic-icon { font-size: 32px; color: white; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }
        #transcript { margin-top: 20px; max-width: 80%; text-align: center; font-style: italic; color: #888; }
        #last-response { margin-top: 20px; max-width: 80%; padding: 15px; background: #333; border-radius: 8px; }
    </style>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body>
    <h1>Gemini Voice</h1>
    <div id="status">Click to Activate</div>
    <button id="micBtn" class="mic-btn">
        <span class="mic-icon">🎤</span>
    </button>
    <div id="transcript">...</div>
    <div id="last-response" style="display:none;"></div>

    <script>
        const socket = io();
            const micBtn = document.getElementById('micBtn');
            const statusDiv = document.getElementById('status');
            const transcriptDiv = document.getElementById('transcript');
            const responseDiv = document.getElementById('last-response');

        let isListening = false;
            let recognition;

            // --- Speech Recognition Setup ---
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true; // Keep listening
            recognition.interimResults = false; // Only final results
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                statusDiv.innerText = "Listening...";
                statusDiv.style.color = "#28a745";
            };

            recognition.onend = () => {
                // Auto-restart logic to keep listening "always on" if desired, 
                // but let's respect manual toggle for now. 
                // If user wants continuous, we can uncomment the restart logic or handle `continuous` better.
                // However, `continuous=true` handles one session. If it disconnects (silence timeout), 
                // we might want to restart.
                if (isListening) { 
                    // Unexpected end (e.g. silence timeout), try to restart?
                    // For now, treat as stop to avoid infinite loops if permission denied.
                    isListening = false;
                    micBtn.classList.remove('listening');
                    statusDiv.innerText = "Click to Activate";
                    statusDiv.style.color = "#aaa";
                }
            };

            recognition.onresult = (event) => {
                // Handle multiple results if needed, but usually just the last one
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        const transcript = event.results[i][0].transcript.trim();
                        transcriptDiv.innerText = `You: "${transcript}"`;
                        if (transcript.length > 0) {
                            console.log("Sending:", transcript);
                            socket.emit('audio_input', transcript);
                        }
                    }
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                statusDiv.innerText = "Error: " + event.error;
            };

        } else {
            statusDiv.innerText = "Web Speech API not supported in this browser.";
            micBtn.disabled = true;
        }

            // --- Socket.IO Events ---
            socket.on('connect', () => {
                console.log("Connected to server");
            });

            socket.on('speak_message', (text) => {
                console.log("Speaking:", text);
                responseDiv.innerText = text;
                responseDiv.style.display = 'block';
                speak(text);
            });

            // --- TTS Function ---
        function speak(text) {
            // Cancel any current speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            // Try to pick a better voice
            // Need to wait for voices to load?
            const setVoice = () => {
                const voices = window.speechSynthesis.getVoices();
                const preferredVoice = voices.find(v => v.name.includes('Google US English')) ||
                    voices.find(v => v.name.includes('Samantha'));
                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }
            };

            if (window.speechSynthesis.getVoices().length === 0) {
                window.speechSynthesis.onvoiceschanged = setVoice;
            } else {
                setVoice();
            }

            window.speechSynthesis.speak(utterance);
        }

            // --- UI Logic ---
            micBtn.addEventListener('click', () => {
            if (isListening) {
                isListening = false;
                recognition.stop();
                micBtn.classList.remove('listening');
                statusDiv.innerText = "Click to Activate";
            } else {
                recognition.start();
            }
        });
    </script>
</body>
</html>
